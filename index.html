<style>
:root{
  --bg:#04070e; --bg2:#081120; --panel:rgba(14,24,44,.55); --line:rgba(120,190,255,.16);
  --gold1:#fff3c4; --gold2:#e8b656; --gold3:#a8702a; --ink:#ebe6da; --muted:#8f8a7e;
  --water:#6cc6ff; --water2:#2f8fe0; --red:#ff5a4d; --green:#5ee08a;
  --mono:"Share Tech Mono",ui-monospace,monospace; --head:"Cinzel",serif; --body:"Oswald",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--gold2);color:#120c02}

/* ---------- boot screen ---------- */
#boot{position:fixed;inset:0;z-index:50;background:#020409;display:flex;align-items:center;justify-content:center;padding:1.5rem;transition:opacity .6s ease,visibility .6s}
#boot.done{opacity:0;visibility:hidden}
.term{width:min(560px,100%);font-family:var(--mono);font-size:clamp(.78rem,2.6vw,.95rem);color:#7fd8ff;line-height:1.65}
.term .ok{color:var(--green)} .term .warn{color:var(--gold2)}
.term .bar{display:block;margin-top:.8rem;height:4px;background:rgba(127,216,255,.15);border-radius:2px;overflow:hidden}
.term .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--water2),var(--water));box-shadow:0 0 12px var(--water)}
.term .skip{margin-top:1.4rem;color:#3d5c74;font-size:.75rem;letter-spacing:.1em}

/* ---------- nav ---------- */
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(.7rem + env(safe-area-inset-top)) clamp(1rem,4vw,2.2rem) .7rem;transition:background .3s,backdrop-filter .3s}
nav.solid{background:rgba(4,7,14,.72);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--head);font-weight:900;letter-spacing:.12em;font-size:1rem;color:var(--gold2);text-decoration:none}
.brand img{width:30px;height:30px}
.navr{display:flex;align-items:center;gap:clamp(.6rem,2.5vw,1.6rem)}
.navr a{color:#c9c3b5;text-decoration:none;font-size:.85rem;letter-spacing:.2em}
.navr a:hover{color:var(--gold1)}
.snd{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:1rem}
@media (max-width:560px){.navr a.hide-s{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:grid;place-items:center;overflow:hidden;isolation:isolate}
#water{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
