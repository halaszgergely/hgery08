<!doctype html><html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="robots" content="noindex,nofollow">
<title>Aszálytúlélő: Nagy Szárazság (béta)</title>
<link rel="icon" type="image/png" href="../../img/favicon-32.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#120c08;color:#f4e6d2;font:500 14px/1.4 system-ui,'Segoe UI',sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr,.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:max(20px,env(safe-area-inset-top)) 16px 24px;z-index:5}
.scr[hidden],.ov[hidden],[hidden]{display:none!important}
#menu,#kut,#end{background:radial-gradient(ellipse at 50% 20%,#4a2a12 0,#1a100a 60%,#0c0806 100%)}
h1{font:900 clamp(30px,6vw,56px)/1 Georgia,'Times New Roman',serif;color:#ffd27a;text-align:center;letter-spacing:.02em;text-shadow:0 3px 0 #5a2a0a,0 0 30px rgba(255,140,40,.35)}
.sub{font:italic 600 18px Georgia,serif;color:#e8b878;margin:6px 0 16px;text-align:center}
.beta{display:inline-block;font:800 11px system-ui;letter-spacing:.14em;color:#120c08;background:#9ad8ff;border-radius:4px;padding:2px 7px;vertical-align:middle;margin-left:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;margin:10px 0}
button{font:700 15px system-ui,sans-serif;color:#f4e6d2;background:linear-gradient(#5a3a1e,#3a2412);border:2px solid #a8742a;border-radius:10px;padding:10px 18px;min-height:44px;cursor:pointer}
button:hover:not(:disabled){background:linear-gradient(#7a4e26,#4a2e16)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid #9ad8ff;outline-offset:2px}
.big{font-size:20px;padding:12px 34px;background:linear-gradient(#c8862a,#7a4a14);color:#fff;border-color:#ffd27a}
#chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:min(980px,100%)}
.ch{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;text-align:center;background:linear-gradient(#2e1e12,#1e140c);border:2px solid #5a3a1e}
.ch img{width:64px;height:120px;object-fit:contain}
.ch b{font:700 14px Georgia,serif;color:#ffd27a}.ch span{font-size:12px;color:#9ad8ff}.ch i{font-style:normal;font-size:11px;color:#c8b8a0}
.ch.on{border-color:#ffd27a;box-shadow:0 0 0 2px #ffd27a,0 0 24px rgba(255,200,100,.35)}
.ch.lock{filter:grayscale(1);opacity:.55;cursor:default}
#seals{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seal{font-size:13px;padding:6px 12px;min-height:36px}.seal.on{border-color:#9ad8ff;color:#9ad8ff}
#sealD{font-size:13px;color:#c8b8a0;min-height:18px;text-align:center}
.gold{font:800 16px system-ui;color:#ffd27a}
#muteBtn{position:fixed;top:10px;right:10px;z-index:9;padding:6px 10px;min-height:36px}
#kutList{width:min(860px,100%);display:grid;gap:12px}
.ag{background:rgba(0,0,0,.3);border:1px solid #5a3a1e;border-radius:12px;padding:12px}
.ag h3{font:800 18px Georgia,serif;color:#ffd27a;margin-bottom:6px}.ag h3 small{font:600 13px system-ui;color:#c8b8a0}
.ag.lock{opacity:.55}
.up{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(168,116,42,.25)}
.up span{font-size:12px;color:#c8b8a0}.up em{font-style:normal;color:#9ad8ff;font-size:12px}
.ub{display:flex;gap:6px}.ub button{min-width:44px;padding:6px 10px}
#lvl{background:rgba(8,5,3,.72);justify-content:center;z-index:6}
#lvlT{font:900 28px Georgia,serif;color:#ffd27a;margin-bottom:12px}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,240px));gap:12px;justify-content:center;width:min(1040px,100%)}
.card{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;min-height:150px;background:linear-gradient(#3a2614,#22160c);border:2px solid #a8742a}
.card.sig{border-color:#9ad8ff}
.card small{color:#9ad8ff;font-weight:800;letter-spacing:.06em}.card b{font:800 18px Georgia,serif;color:#ffd27a}.card span{font-size:14px;color:#f4e6d2;font-weight:500}.card em{font-style:normal;font-size:12px;color:#c8b8a0}
.card kbd{position:absolute;top:8px;right:10px;font:700 12px system-ui;color:#8a7a60}
#bnBtn.on{border-color:#ff6a4a;color:#ff8a6a}
#pause,#endBox{background:rgba(8,5,3,.8);justify-content:center}
.box{background:linear-gradient(#2e1e12,#1a100a);border:2px solid #a8742a;border-radius:14px;padding:20px;width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:10px}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;width:100%}.stat b{color:#ffd27a;float:right}
.wl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.wl span{font-size:12px;background:rgba(108,198,255,.15);border-radius:6px;padding:2px 7px}.wl .p{background:rgba(255,210,122,.12)}
#endT{font:900 34px Georgia,serif;color:#ff6a4a;text-align:center}#endT.win{color:#9ad8ff}
h2{font:900 26px Georgia,serif;color:#ffd27a}
@media(max-width:600px){#menu h1{margin-top:34px}#menu>.row:last-child{position:sticky;bottom:-24px;padding:10px 0 14px;margin-bottom:-24px;width:100%;background:linear-gradient(transparent,#0c0806 30%)}}
</style></head><body>
<canvas id="c"></canvas>
<button id="muteBtn" aria-label="Hang">🔊</button>
<div id="menu" class="scr">
  <h1>ASZÁLYTÚLÉLŐ<span class="beta">BÉTA</span></h1>
  <div class="sub">A Nagy Szárazság</div>
  <div id="chars"></div>
  <div class="row"><div id="seals"></div></div>
  <div id="sealD"></div>
  <div class="row"><button id="startBtn" class="big">INDÍTÁS</button><button id="kutBtn">Tanácsi Kút · <span class="gold" id="gold">0</span> ◆</button><button id="allBtn">Béta: minden feloldása</button></div>
</div>
<div id="kut" class="scr" hidden>
  <h2>Tanácsi Kút</h2>
  <div class="row"><span class="gold"><span id="kgold">0</span> ◆ aranycsepp</span><button id="refund">Visszatérítés</button><button id="kutBack">Vissza</button></div>
  <div id="kutList"></div>
</div>
<div id="lvl" class="ov" hidden>
  <div id="lvlT">SZINTLÉPÉS</div>
  <div id="cards"></div>
  <div class="row"><button id="rrBtn">Újrasorsolás</button><button id="skBtn">Kihagyás</button><button id="bnBtn">Száműzés</button></div>
</div>
<div id="pause" class="ov" hidden><div class="box"><h2>SZÜNET</h2><div class="stat" id="pstat"></div><div class="row"><button id="goBtn" class="big">Folytatás</button><button id="quitBtn">Feladás</button></div></div></div>
<div id="end" class="scr" hidden><div class="box" style="margin-top:8vh"><div id="endT">KISZÁRADTÁL</div><div class="stat" id="estat"></div><div class="row"><button id="againBtn" class="big">Új kör</button><button id="menuBtn">Menü</button></div></div></div>
<script type="module" src="menu.js?v=202611272153"></script>
</body></html>
