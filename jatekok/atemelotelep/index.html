/* képernyők, panelek */
.scr,#pn{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto;touch-action:pan-y;z-index:5}
.scr{background:radial-gradient(ellipse at 50% 0%,rgba(20,40,60,.35),rgba(2,4,8,.82))}#menu{background:linear-gradient(90deg,rgba(2,4,8,.88) 0,rgba(2,4,8,.55) 50%,rgba(2,4,8,.1));justify-content:flex-start;padding-left:max(14px,6vw)}#pn{background:rgba(2,4,8,.55)}
.card{width:min(760px,100%);background:linear-gradient(180deg,rgba(18,27,39,.97),rgba(11,17,25,.97));border:1px solid var(--ln);border-radius:18px;padding:20px 22px;box-shadow:0 24px 70px rgba(0,0,0,.65);max-height:100%;overflow:auto}.card.wide{width:min(1040px,100%)}
#menu .card{width:min(440px,100%);background:none;border:0;box-shadow:none}
h1{font:900 26px/1.1 Cinzel,Georgia,serif;letter-spacing:.05em;color:var(--gold)}h1 small{display:block;font:700 10px Inter;letter-spacing:.24em;color:var(--mut);margin-top:6px}
#menu h1{font-size:clamp(30px,5vw,46px);text-shadow:0 2px 30px rgba(232,182,86,.25)}
h2{font:800 10px Inter;letter-spacing:.2em;color:var(--mut);margin:14px 0 7px;text-transform:uppercase}
p{margin:6px 0}.mut{color:var(--mut)}.warn{color:#ff7a6e;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.b{border:1px solid var(--ln);background:var(--pn2);color:var(--ink);border-radius:11px;padding:9px 14px;font:700 13px Inter;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,background .15s}.b:hover{border-color:rgba(232,182,86,.6)}.b.go{background:linear-gradient(180deg,#f2c76d,#d59d3a);color:#1b1304;border-color:transparent}.b.sm{padding:5px 9px;font-size:12px}.b[disabled]{opacity:.35;cursor:default}.b.on{border-color:var(--gold);color:var(--gold2)}.b.red{background:#7a1f1a;border-color:#ff5a4d}
.mlist{display:flex;flex-direction:column;gap:9px;margin-top:22px;max-width:340px}.mlist .b{justify-content:flex-start;padding:12px 16px;font-size:14px}
.tabs{display:flex;gap:4px;margin:10px 0;border-bottom:1px solid var(--ln);overflow-x:auto}.tab{background:none;border:0;color:var(--mut);font:700 12px Inter;padding:9px 11px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.tab.on{color:var(--gold2);border-color:var(--gold)}
.blk{background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;min-width:220px;flex:1}
.led{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 4px 0 10px;vertical-align:-1px}.leds{font:700 11px Inter;color:var(--mut)}
.fz{margin:6px 0;line-height:1.3}.fuse{display:inline-block;width:34px;height:12px;border-radius:6px;background:linear-gradient(90deg,#aaa 0 20%,#e8e0c8 20% 80%,#aaa 80%);margin-right:8px;vertical-align:-1px}
.mcb{display:inline-block;width:24px;height:32px;border-radius:4px;background:#e9e6dc;margin-right:8px;vertical-align:middle;position:relative;cursor:pointer;border:1px solid #999}.mcb i{position:absolute;left:6px;width:10px;height:12px;background:#2a2f38;border-radius:2px;top:15px;transition:top .1s}.mcb.on i{top:3px;background:#1c7a3c}
.rot{position:relative;height:110px;width:100%;max-width:300px;margin:4px auto}.rot.sm{height:80px;width:80px;margin:6px 0}.dial{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:radial-gradient(#d33,#811);box-shadow:0 0 0 6px #e8d23a;transition:transform .2s}.dial::after{content:"";position:absolute;left:28px;top:-2px;width:8px;height:36px;background:#fff;border-radius:4px}.rot span{position:absolute;bottom:0;font:800 10px Inter;color:var(--mut)}
.mm{font:700 22px/1.3 "Courier New",monospace;background:#9fb39a;color:#10200f;border-radius:8px;padding:12px;min-height:58px;box-shadow:inset 0 0 12px rgba(0,0,0,.4)}.mm.sm{font-size:14px;min-height:0;padding:8px}.mm small{font-size:12px}.mm .warn{color:#7a1f1a}
.strip{display:flex;gap:3px;background:#2b2f36;padding:8px;border-radius:8px;overflow:auto}.term{width:64px;min-width:64px;height:78px;background:linear-gradient(#4a8ce0,#2f6cc0);border-radius:4px;color:#fff;text-align:center;font:800 13px Inter;padding-top:6px;cursor:pointer;display:flex;flex-direction:column;gap:10px}.term small{font:700 10px Inter;background:rgba(0,0,0,.35);margin:0 4px;border-radius:3px;padding:2px 0}.term.full{background:linear-gradient(#5a5f68,#3a3f48)}
.wire{border:1px solid var(--ln);background:var(--pn2);color:var(--ink);border-radius:20px;padding:6px 11px 6px 7px;font:700 12px Inter;cursor:pointer;display:flex;align-items:center;gap:6px}.wire i{width:22px;height:8px;border-radius:4px;background:var(--wc);box-shadow:0 0 0 1px rgba(255,255,255,.3)}.wire.on{border-color:var(--gold);color:var(--gold2)}
.crt{background:#04110a;color:#7fff9a;font:600 13px/1.5 "Courier New",monospace;border-radius:8px;padding:14px;min-height:160px;box-shadow:inset 0 0 30px rgba(0,255,100,.08)}.crt.off{color:#333}.crt .warn{color:#ff6b5a}.crt b{color:#c8ffd0}
.syn{display:flex;gap:30px}.tank{position:relative;width:110px;height:200px;border:2px solid #7fff9a;border-top:none}.tank .water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#2f7a5a,#1a4a3a)}.tank .mk{position:absolute;right:-110px;width:104px;font-size:10px;border-top:1px dashed rgba(127,255,154,.5)}
.al td{padding:3px 8px;vertical-align:top}.al td:first-child{color:#ffd84a;white-space:nowrap}
.prog{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pg label{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 12px Inter;margin:4px 0}.pg input{width:72px;background:#04110a;color:#7fff9a;border:1px solid #2f6a4a;border-radius:6px;padding:5px 6px;font:700 14px "Courier New"}
pre.st,select.st{display:block;width:100%;background:#04110a;color:#7fff9a;border:1px solid #1f4a33;border-radius:6px;padding:6px 8px;font:600 12px/1.45 "Courier New",monospace;margin:4px 0;white-space:pre-wrap}select.st{cursor:pointer}
#pgc{width:100%;max-height:220px;border-radius:8px;background:#04110a}.chk{list-style:none;padding:0;margin:8px 0}.chk li{font:600 12px Inter;margin:3px 0}.chk .ok{color:var(--ok)}.chk .bad{color:#ff7a6e}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}.itm{background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:9px 11px;display:flex;align-items:center;gap:10px;justify-content:space-between}.itm .ic{font-size:22px;color:var(--mut)}.itm.got{border-color:rgba(232,182,86,.5)}.itm.got .ic{color:var(--gold)}#end .itm{justify-content:flex-start}#end .itm:not(.got){opacity:.45}
.bar{height:12px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
.doc .dbody{background:#efe9da;color:#2a2418;border-radius:8px;padding:16px 18px;margin-top:10px;font:500 14px/1.55 Inter}.doc .mut{color:#7a6e58}.doc ol{padding-left:20px}.doc li{margin:4px 0}.hand{font:600 26px/1.25 Caveat,cursive;color:#5a1a10}
.tb{border-collapse:collapse;width:100%}.tb td,.tb th{border:1px solid #b8ab8c;padding:4px 7px;font-size:12.5px;text-align:left}.tb th{background:#d8cfb8}
.eplan .eh{display:flex;justify-content:space-between;border:2px solid #2a2418;padding:4px 8px;font:800 11px Inter;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.stats div{background:var(--pn2);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.stats small{font:800 10px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}.stats b{font:900 30px Cinzel,Georgia,serif;color:var(--gold2)}.stats em{font-style:normal;font-size:12px;color:var(--mut)}
/* beállítások */
.set{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px 18px}label.s{display:flex;flex-direction:column;gap:5px;font:800 10px Inter;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}label.s span{color:var(--gold2);letter-spacing:0;font-size:12px;text-transform:none;float:right}
select{background:var(--pn2);color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:8px 9px;font:600 13px Inter}input[type=range]{accent-color:var(--gold);width:100%}.sh{grid-column:1/-1;font:800 11px Inter;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;border-bottom:1px solid var(--ln);padding-bottom:6px;margin-top:6px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3;font-family:Inter,system-ui,sans-serif}
.gl{background:var(--glass);border:1px solid rgba(140,180,230,.14);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#obj{position:absolute;left:max(14px,env(safe-area-inset-left));top:14px;max-width:min(430px,calc(100vw - 28px));padding:10px 14px 11px}#objH{font:800 10px Inter;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}#objL{list-style:none;padding:0;margin:6px 0 0}#objL li{display:flex;gap:8px;align-items:flex-start;font:600 13px/1.35 Inter;margin:3px 0;text-shadow:0 1px 2px #000}#objL li .ic{margin-top:2px;color:var(--mut);font-size:13px}#objL li.ok{color:#8fd8a0}#objL li.ok .ic{color:var(--ok)}
.meter{position:absolute;bottom:16px;padding:9px 13px;min-width:150px}.meter small{display:block;font:800 9.5px Inter;letter-spacing:.16em;color:var(--mut)}.meter b{font:800 19px Inter;display:block;margin:1px 0 5px}.meter .t{height:5px;background:rgba(255,255,255,.12);border-radius:3px;position:relative}.meter .t i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:3px;transition:width .3s}.meter .t u{position:absolute;left:90%;top:-3px;bottom:-3px;width:2px;background:var(--bad)}
#lvlBox{left:max(14px,env(safe-area-inset-left));width:200px}#lvlBox.mid .t i{background:#ffd84a}#lvlBox.warn .t i{background:var(--bad)}#lvlBox.warn small{color:var(--bad);animation:bl .6s steps(2) infinite}
#gasBox{left:226px}#gasBox.mid small,#gasBox.mid b{color:#ffd84a}#gasBox.warn small,#gasBox.warn b{color:var(--bad)}@keyframes bl{50%{opacity:.3}}
#bat{position:absolute;right:16px;bottom:18px;font:700 12px Inter;color:#ffd84a;text-shadow:0 1px 3px #000}#bat.warn{color:var(--bad)}
#cross{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 3px rgba(0,0,0,.8);transition:all .12s}#cross.on{width:9px;height:9px;margin:-4.5px;background:var(--gold2);box-shadow:0 0 10px rgba(232,182,86,.6)}
#prompt{position:absolute;left:50%;top:calc(50% + 24px);transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:7px 13px 7px 8px;font:700 14px Inter;white-space:nowrap;opacity:0;transition:opacity .15s;background:var(--glass);border:1px solid rgba(232,182,86,.28);border-radius:12px;max-width:92vw}#prompt.on{opacity:1}
kbd{font:800 11px Inter;background:linear-gradient(180deg,#f2c76d,#d59d3a);color:#1b1304;border-radius:6px;padding:3px 7px;min-width:22px;text-align:center}
#ring{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px}#ring svg{width:52px;height:52px;transform:rotate(-90deg)}#ring circle{fill:none;stroke-width:4.5}#holdN{position:absolute;top:60px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 13px Inter;text-shadow:0 1px 3px #000}
#banner{position:absolute;left:0;right:0;top:27%;text-align:center;opacity:0;transition:opacity .8s}#banner.on{opacity:1}#bnA{font:800 12px Inter;letter-spacing:.3em;color:var(--mut);text-transform:uppercase}#bnB{font:900 clamp(28px,6vw,48px) Cinzel,Georgia,serif;color:var(--gold);text-shadow:0 2px 24px rgba(0,0,0,.8)}
#tips{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);display:flex;gap:9px;align-items:center;padding:8px 14px;font:600 13px Inter;opacity:0;transition:opacity .5s;white-space:nowrap;max-width:94vw}#tips.on{opacity:.92}#tips .ic{color:var(--gold)}
#caps{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);font:600 13px Inter;color:#dfe6f0;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}#caps.on{opacity:1}
#wp{position:absolute;left:0;top:0;margin:-14px 0 0 -14px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--gold2);transition:opacity .4s;filter:drop-shadow(0 1px 3px #000)}#wp .ic{font-size:26px}#wp span{font:800 10px Inter;color:#fff}
#hurt{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(110,130,30,.9));opacity:0}#flashL{position:absolute;inset:0;background:rgba(220,230,255,1);opacity:0}
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.55))}
#dbg{position:fixed;right:8px;top:8px;z-index:9;font:600 11px/1.4 "Courier New",monospace;color:#9f9;background:rgba(0,0,0,.7);padding:6px 8px;border-radius:6px;white-space:pre;pointer-events:none}
/* érintés */
#tc{position:fixed;inset:0;z-index:2}#tc .tb2{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(10,16,26,.5);border:1.5px solid rgba(255,255,255,.22);color:#fff;font:800 10px Inter;letter-spacing:.06em;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}#tc .tb2 .ic{font-size:20px}#tc .tb2.on{background:rgba(232,182,86,.55)}#tc .tb2.lit{border-color:var(--gold);color:var(--gold2)}
#tc .use{right:calc(22px + env(safe-area-inset-right));bottom:calc(118px + env(safe-area-inset-bottom));width:86px;height:86px;background:rgba(232,182,86,.32);border-color:rgba(232,182,86,.7)}
#joy{position:absolute;left:0;top:0;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(10,16,26,.25);opacity:0;transition:opacity .15s;pointer-events:none}#joy.on{opacity:1}#knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(232,182,86,.55);border:2px solid rgba(255,226,154,.8)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4;transition:opacity .6s;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font:600 17px/1.5 Inter;color:#ddd}#fade.on{opacity:1}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--glass);border:1px solid var(--ln);border-radius:12px;padding:9px 16px;font-weight:700;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center;backdrop-filter:blur(6px)}#toast.on{opacity:1}
#load{position:fixed;inset:0;z-index:10;background:#020408;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}#load h1{font-size:30px}#load i{display:block;width:180px;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);background-size:200% 100%;animation:ld 1.2s linear infinite}@keyframes ld{to{background-position:-200% 0}}
@media(pointer:coarse){#obj{max-width:calc(100vw - 170px - env(safe-area-inset-right))}}
