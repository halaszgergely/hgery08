<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="robots" content="noindex,nofollow"><title>Az Átemelőtelep – HGWS Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--pn:#0d131c;--pn2:#151e2b;--ln:rgba(140,180,230,.18);--ink:#e9eef6;--mut:#8b9ab0;--gold:#e8b656;--ok:#5ee08a;--bad:#ff5a4d}
*{box-sizing:border-box;margin:0}html,body{height:100%;background:#000;color:var(--ink);font:500 14px/1.45 Inter,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#h{pointer-events:none}
[hidden]{display:none!important}
.scr,#pn{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto;touch-action:pan-y;z-index:5}
.scr{background:radial-gradient(ellipse at 50% 10%,rgba(30,60,80,.55),rgba(2,4,8,.95))}#pn{background:rgba(2,4,8,.55)}
.card{width:min(760px,100%);background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:100%;overflow:auto}.card.wide{width:min(1040px,100%)}
h1{font:900 26px/1.1 Cinzel,Georgia,serif;letter-spacing:.05em;color:var(--gold)}h1 small{display:block;font:700 10px Inter;letter-spacing:.24em;color:var(--mut);margin-top:6px}
h2{font:800 10px Inter;letter-spacing:.2em;color:var(--mut);margin:14px 0 7px;text-transform:uppercase}
p{margin:6px 0}.mut{color:var(--mut)}.warn{color:#ff7a6e;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.b{border:1px solid var(--ln);background:var(--pn2);color:var(--ink);border-radius:10px;padding:8px 13px;font:700 13px Inter;cursor:pointer}.b:hover{border-color:rgba(232,182,86,.6)}.b.go{background:linear-gradient(180deg,#f2c76d,#d59d3a);color:#1b1304;border-color:transparent}.b.sm{padding:5px 9px;font-size:12px}.b[disabled]{opacity:.35;cursor:default}.b.on{border-color:var(--gold);color:#ffe29a}.b.red{background:#7a1f1a;border-color:#ff5a4d}
.tabs{display:flex;gap:4px;margin:10px 0;border-bottom:1px solid var(--ln)}.tab{background:none;border:0;color:var(--mut);font:700 12px Inter;padding:8px 10px;cursor:pointer;border-bottom:2px solid transparent}.tab.on{color:#ffe29a;border-color:var(--gold)}
.blk{background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;min-width:220px;flex:1}
.led{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 4px 0 10px;vertical-align:-1px}.leds{font:700 11px Inter;color:var(--mut)}
.fz{margin:6px 0;line-height:1.3}.fuse{display:inline-block;width:34px;height:12px;border-radius:6px;background:linear-gradient(90deg,#aaa 0 20%,#e8e0c8 20% 80%,#aaa 80%);margin-right:8px;vertical-align:-1px}
.mcb{display:inline-block;width:22px;height:30px;border-radius:4px;background:#e9e6dc;margin-right:8px;vertical-align:middle;position:relative;cursor:pointer;border:1px solid #999}.mcb i{position:absolute;left:5px;width:10px;height:12px;background:#2a2f38;border-radius:2px;top:14px;transition:top .1s}.mcb.on i{top:3px;background:#1c7a3c}
.rot{position:relative;height:110px;width:100%;max-width:300px;margin:4px auto}.rot.sm{height:80px;width:80px;margin:6px 0}.dial{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:radial-gradient(#d33,#811);box-shadow:0 0 0 6px #e8d23a}.dial::after{content:"";position:absolute;left:28px;top:-2px;width:8px;height:36px;background:#fff;border-radius:4px}.rot span{position:absolute;bottom:0;font:800 10px Inter;color:var(--mut)}
.mm{font:700 22px/1.3 "Courier New",monospace;background:#9fb39a;color:#10200f;border-radius:8px;padding:12px;min-height:58px;box-shadow:inset 0 0 12px rgba(0,0,0,.4)}.mm.sm{font-size:14px;min-height:0;padding:8px}.mm small{font-size:12px}.mm .warn{color:#7a1f1a}
.strip{display:flex;gap:3px;background:#2b2f36;padding:8px;border-radius:8px;overflow:auto}.term{width:64px;min-width:64px;height:78px;background:linear-gradient(#4a8ce0,#2f6cc0);border-radius:4px;color:#fff;text-align:center;font:800 13px Inter;padding-top:6px;cursor:pointer;display:flex;flex-direction:column;gap:10px}.term small{font:700 10px Inter;background:rgba(0,0,0,.35);margin:0 4px;border-radius:3px;padding:2px 0}.term.full{background:linear-gradient(#5a5f68,#3a3f48)}
.wire{border:1px solid var(--ln);background:var(--pn2);color:var(--ink);border-radius:20px;padding:5px 10px 5px 6px;font:700 12px Inter;cursor:pointer;display:flex;align-items:center;gap:6px}.wire i{width:22px;height:8px;border-radius:4px;background:var(--wc);box-shadow:0 0 0 1px rgba(255,255,255,.3)}.wire.on{border-color:var(--gold);color:#ffe29a}
.crt{background:#04110a;color:#7fff9a;font:600 13px/1.5 "Courier New",monospace;border-radius:8px;padding:14px;min-height:160px;box-shadow:inset 0 0 30px rgba(0,255,100,.08)}.crt.off{color:#333}.crt .warn{color:#ff6b5a}.crt b{color:#c8ffd0}
.syn{display:flex;gap:30px}.tank{position:relative;width:110px;height:200px;border:2px solid #7fff9a;border-top:none}.tank .water{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#2f7a5a,#1a4a3a)}.tank .mk{position:absolute;right:-110px;width:104px;font-size:10px;border-top:1px dashed rgba(127,255,154,.5)}
.al td{padding:3px 8px;vertical-align:top}.al td:first-child{color:#ffd84a;white-space:nowrap}
.prog{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pg label{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 12px Inter;margin:4px 0}.pg input{width:70px;background:#04110a;color:#7fff9a;border:1px solid #2f6a4a;border-radius:6px;padding:4px 6px;font:700 13px "Courier New"}
pre.st,select.st{display:block;width:100%;background:#04110a;color:#7fff9a;border:1px solid #1f4a33;border-radius:6px;padding:6px 8px;font:600 12px/1.45 "Courier New",monospace;margin:4px 0;white-space:pre-wrap}select.st{cursor:pointer}
#pgc{width:100%;max-height:220px;border-radius:8px;background:#04110a}.chk{list-style:none;padding:0;margin:8px 0}.chk li{font:600 12px Inter;margin:3px 0}.chk .ok{color:var(--ok)}.chk .bad{color:#ff7a6e}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}.itm{background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:12px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
.doc .dbody{background:#efe9da;color:#2a2418;border-radius:8px;padding:16px 18px;margin-top:10px;font:500 14px/1.55 Inter}.doc .mut{color:#7a6e58}.doc ol{padding-left:20px}.doc li{margin:4px 0}.hand{font:600 26px/1.25 Caveat,cursive;color:#5a1a10}
.tb{border-collapse:collapse;width:100%}.tb td,.tb th{border:1px solid #b8ab8c;padding:4px 7px;font-size:12.5px;text-align:left}.tb th{background:#d8cfb8}
.eplan .eh{display:flex;justify-content:space-between;border:2px solid #2a2418;padding:4px 8px;font:800 11px Inter;margin-bottom:8px}
#tc{position:fixed;inset:0;z-index:2}#tc .tb2{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(14,21,34,.55);border:2px solid rgba(255,255,255,.25);color:#fff;font:800 12px Inter;display:flex;align-items:center;justify-content:center}
.set{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}label.s{display:flex;flex-direction:column;gap:4px;font:700 10px Inter;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}label.s span{color:var(--ink);letter-spacing:0;font-size:12px;text-transform:none}select{background:var(--pn2);color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:7px 9px;font:600 13px Inter}input[type=range]{accent-color:var(--gold)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4;transition:opacity .6s;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font:600 17px/1.5 Inter;color:#ddd}#fade.on{opacity:1}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(10,14,20,.92);border:1px solid var(--ln);border-radius:12px;padding:9px 16px;font-weight:700;z-index:6;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}#toast.on{opacity:1}
@media(max-width:700px){.prog{grid-template-columns:1fr}h1{font-size:20px}.syn{flex-direction:column}}
</style></head><body>
<canvas id="c"></canvas><canvas id="h"></canvas>
<div id="tc" hidden><div class="tb2" data-b="use" style="right:24px;bottom:120px;width:76px;height:76px;background:rgba(232,182,86,.45)">HASZNÁL</div><div class="tb2" data-b="flash" style="right:112px;bottom:40px">LÁMPA</div><div class="tb2" data-b="run" style="right:24px;bottom:30px">FUTÁS</div><div class="tb2" data-b="inv" style="right:24px;top:70px;width:52px;height:52px">TÁSKA</div><div class="tb2" data-b="menu" style="left:50%;top:10px;width:46px;height:46px;margin-left:-23px">II</div></div>
<div id="pn" hidden></div>
<div class="scr" id="menu"><div class="card">
  <h1>AZ ÁTEMELŐTELEP<small>ÉJSZAKAI ÜGYELET · HGWS</small></h1>
  <p class="mut" id="mBest" style="margin-top:10px"></p>
  <div class="row" style="margin-top:16px"><button class="b go" id="mCont" hidden>Folytatás</button><button class="b" id="mNew">Új játék</button><button class="b" id="mSet">Beállítások</button></div>
  <div id="mSt" class="mut" style="margin-top:10px"></div>
</div></div>
<div class="scr" id="pause" hidden><div class="card" style="width:min(420px,100%)"><h1>SZÜNET</h1><p class="mut" id="pSub"></p>
  <div class="row" style="margin-top:14px;flex-direction:column;align-items:stretch"><button class="b go" id="pRes">Folytatás</button><button class="b" id="pInv">Leltár és dokumentumok</button><button class="b" id="pSet">Beállítások</button><button class="b" id="pCp">Utolsó ellenőrzőpont betöltése</button><button class="b" id="pMenu">Mentés és kilépés a menübe</button></div></div></div>
<div class="scr" id="sets" hidden><div class="card"><div class="row"><h1 class="grow">BEÁLLÍTÁSOK</h1><button class="b go" id="sOk">Kész</button></div>
  <div class="set" style="margin-top:14px"><label class="s">Egérérzékenység <span id="vSens"></span><input type="range" id="sSens" min="0.2" max="3" step="0.05"></label><label class="s">Látószög (FOV) <span id="vFov"></span><input type="range" id="sFov" min="60" max="105" step="1"></label>
  <label class="s">Hangerő <span id="vVol"></span><input type="range" id="sVol" min="0" max="1" step="0.05"></label><label class="s">Grafika<select id="sQ"><option value="0">Alacsony</option><option value="1">Közepes</option><option value="2">Magas</option></select></label>
  <label class="s">Ijesztő pillanatok<select id="sScary"><option value="0">Bekapcsolva</option><option value="1">Kevésbé ijesztő mód</option></select></label><label class="s">Szintjelző a sarokban<select id="sLvl"><option value="1">Látszik</option><option value="0">Rejtve</option></select></label></div></div></div>
<div class="scr" id="end" hidden><div class="card"><h1>HAJNAL<small>A TELEP ÚJRA A SCADA-N</small></h1><div id="eBody" style="margin-top:12px"></div><div class="row" style="margin-top:14px"><button class="b go" id="eNew">Új játék</button><button class="b" id="eMenu">Menü</button></div></div></div>
<div id="fade"></div><div id="toast"></div>
<script type="module" src="./kliens.js?v=202611211712"></script>
</body></html>
