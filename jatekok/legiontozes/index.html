<!doctype html><html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="robots" content="noindex,nofollow">
<title>HGWS Légi Öntözés</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../../img/favicon-32.png">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }</script>
<style>
:root{--bg:#0a0f14;--pn:rgba(9,14,20,.82);--pn2:#121b25;--ln:rgba(140,190,230,.16);--ink:#eef3f8;--mut:#93a3b6;--y:#f2c230;--g:#3fbf63;--b:#2aa7d9;--bad:#ff5a4d}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:var(--bg);color:var(--ink);font:500 14px/1.45 Inter,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn{border:1px solid var(--ln);background:var(--pn2);border-radius:11px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s,transform .1s}
.btn:hover{border-color:rgba(242,194,48,.65)}.btn:active{transform:scale(.97)}.btn.y{background:linear-gradient(180deg,#f6cf4a,#d9a51c);color:#1a1204;border:0}.btn.g{background:linear-gradient(180deg,#48c96c,#2a9a4b);color:#06180c;border:0}.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}.btn:disabled{opacity:.4;cursor:default}
.lab{font:800 10px Inter;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
h1,h2,h3{font-weight:900;letter-spacing:-.01em}.mut{color:var(--mut)}.y{color:var(--y)}
/* betöltés */
#load{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#13243a,#06090d 70%)}
#load .in{text-align:center;width:min(380px,86vw)}#load .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin:16px 0 8px}#load .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--y));transition:width .2s}
.logo{display:inline-flex;align-items:center;gap:10px;font:900 15px Inter;letter-spacing:.24em;color:var(--y)}.logo b{width:30px;height:30px;border-radius:50%;background:var(--b);display:grid;place-items:center;color:#fff;font-size:16px}
/* menük */
.scr{position:fixed;inset:0;z-index:20;display:flex;pointer-events:none}.scr>*{pointer-events:auto}
#menu{align-items:flex-end;justify-content:flex-start;padding:max(22px,env(safe-area-inset-left));background:linear-gradient(90deg,rgba(6,9,13,.78),transparent 60%)}
#menu .col{display:flex;flex-direction:column;gap:9px;width:min(320px,86vw);margin-bottom:max(10px,env(safe-area-inset-bottom))}
#menu h1{font-size:clamp(30px,5vw,50px);line-height:1;margin:10px 0 4px}#menu h1 span{color:var(--y)}#menu .sub{color:var(--mut);margin-bottom:14px}
#menu .col .btn{justify-content:flex-start;padding:12px 16px;font-size:15px}#menu .col .btn i{font-style:normal;width:22px;text-align:center}
#menu .who{font-size:12px;color:var(--mut);margin-top:6px}
.sheet{margin:auto;width:min(980px,96vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--ln)}.sheet header h2{font-size:19px;flex:1}
.sheet .body{padding:14px 16px;overflow:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs .btn{padding:7px 12px;font-size:13px}.tabs .btn.on{border-color:var(--y);color:var(--y)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{border:1px solid var(--ln);background:rgba(18,27,37,.75);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card h3{font-size:15px}.card .meta{font-size:12px;color:var(--mut)}.card .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
.tag{display:inline-block;font:800 10px Inter;letter-spacing:.08em;padding:2px 7px;border-radius:6px;background:rgba(42,167,217,.18);color:#9fdcff;text-transform:uppercase}.tag.y{background:rgba(242,194,48,.18);color:var(--y)}.tag.g{background:rgba(63,191,99,.18);color:#8fe7a7}.tag.r{background:rgba(255,90,77,.16);color:#ffa49b}
/* hangár */
#hangar{flex-direction:column;justify-content:flex-end}
#hangar .top{position:absolute;left:0;right:0;top:0;display:flex;gap:10px;align-items:center;padding:12px max(14px,env(safe-area-inset-left))}
#hangar .top h2{flex:1;font-size:18px}
#hList{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 12px;scrollbar-width:thin}
#hList .pl{flex:0 0 auto;min-width:118px;max-width:150px;border:1px solid var(--ln);background:rgba(10,15,20,.8);border-radius:11px;padding:8px 10px;text-align:left}
#hList .pl.on{border-color:var(--y);box-shadow:0 0 0 1px var(--y) inset}#hList .pl b{display:block;font-size:12.5px;line-height:1.2}#hList .pl small{color:var(--mut);font-size:11px}
#hList .pl.lock{opacity:.55}
#hInfo{position:absolute;right:max(14px,env(safe-area-inset-right));top:64px;width:min(330px,calc(100vw - 28px));padding:14px}
#hInfo h3{font-size:18px;margin-bottom:2px}#hInfo p{font-size:13px;color:#cfd9e4;margin:8px 0}
.stat{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:8px;margin:5px 0;font-size:12px;color:var(--mut)}.stat i{display:block;height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.stat i b{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--y))}
.kv{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin-top:6px}.kv b{color:var(--ink)}
/* beállítások */
.set{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}.set label{font-weight:600}.set select,.set input[type=range]{min-width:180px}
select,input[type=text]{background:#0c131b;border:1px solid var(--ln);color:var(--ink);border-radius:9px;padding:7px 10px;font:600 14px Inter}input[type=range]{accent-color:var(--y)}
.help{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.help table{width:100%;border-collapse:collapse;font-size:13px}.help td{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.05)}.help td:first-child{color:var(--y);font-weight:800;white-space:nowrap;width:40%}
.lb{width:100%;border-collapse:collapse}.lb td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.06)}.lb td:first-child{width:34px;color:var(--mut);font-weight:800}.lb td:last-child{text-align:right;font-weight:800;color:var(--y)}.lb tr.me td{background:rgba(242,194,48,.08)}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud .pn{border-radius:12px}
#hL{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px}
#tele{padding:9px 12px;display:grid;grid-template-columns:auto auto;gap:2px 14px;align-items:baseline;min-width:200px}
#tele .v{font:900 24px/1 Inter;font-variant-numeric:tabular-nums;text-align:right}#tele .v small{font:700 11px Inter;color:var(--mut);margin-left:3px}
#bars{padding:8px 12px;display:flex;flex-direction:column;gap:5px;min-width:200px}
.hb{display:grid;grid-template-columns:62px 1fr 38px;gap:8px;align-items:center;font:700 11px Inter;color:var(--mut)}.hb i{height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}.hb i b{display:block;height:100%;background:var(--y)}.hb.w i b{background:var(--b)}.hb.bt i b{background:var(--g)}.hb span{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
#flags{display:flex;gap:5px;flex-wrap:wrap}#flags span{font:800 10px Inter;letter-spacing:.1em;padding:3px 7px;border-radius:6px;background:rgba(9,14,20,.8);border:1px solid var(--ln);color:var(--mut)}#flags span.on{color:var(--y);border-color:rgba(242,194,48,.5)}
#hR{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#att{width:150px;height:150px;border-radius:50%;display:block}
#mini{width:170px;height:170px;border-radius:12px;display:block;border:1px solid var(--ln);pointer-events:auto;cursor:pointer;touch-action:manipulation}
#mis{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);padding:8px 16px;text-align:center;min-width:220px}
#mis .t{font:900 22px/1.1 Inter;font-variant-numeric:tabular-nums}#mis .s{font-size:12px;color:var(--mut)}
#warn{position:absolute;left:50%;top:34%;transform:translateX(-50%);font:900 26px Inter;letter-spacing:.1em;color:var(--bad);text-shadow:0 2px 10px #000;animation:bl .5s steps(2) infinite}@keyframes bl{50%{opacity:.25}}
#msg{position:absolute;left:50%;top:22%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
#msg div{padding:8px 16px;border-radius:10px;background:rgba(9,14,20,.85);border:1px solid var(--ln);font-weight:700;animation:fi .25s}#msg div.ok{border-color:rgba(63,191,99,.6);color:#a6f0bb}#msg div.bad{border-color:rgba(255,90,77,.6);color:#ffb0a8}#msg div.big{font-size:22px;color:var(--y);border-color:rgba(242,194,48,.6)}
@keyframes fi{from{opacity:0;transform:translateY(-6px)}}
#arrow{position:absolute;left:50%;top:50%;width:0;height:0}#arrow i{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border:3px solid var(--y);border-left:0;border-bottom:0;transform-origin:50% 50%}#arrow b{position:absolute;left:-40px;width:80px;text-align:center;top:22px;font:800 12px Inter;color:var(--y);text-shadow:0 1px 3px #000}
#cross{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border:2px solid rgba(255,255,255,.7);border-radius:50%}#cross::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff;border-radius:50%}
#aim{position:absolute;width:22px;height:22px;margin:-11px;border:2px solid var(--b);border-radius:50%;box-shadow:0 0 8px var(--b)}
#cock{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#1d2328,#111518);border-top:3px solid #2b3238;display:flex;gap:2vw;justify-content:center;align-items:center;padding:1vh 2vw}
#cock .g{width:min(13vh,110px);height:min(13vh,110px);border-radius:50%;background:radial-gradient(circle,#0d1114 60%,#2c3439);border:3px solid #3a444b;display:grid;place-items:center;text-align:center;font:800 min(2.2vh,15px) Inter;color:#e8f0f6}
#cock .g small{display:block;font:700 min(1.4vh,10px) Inter;color:#8fa0ae;letter-spacing:.1em}
#mapS{position:fixed;inset:0;z-index:30;background:rgba(4,7,10,.88);display:flex;flex-direction:column}
#mapS header{display:flex;align-items:center;gap:10px;padding:10px 14px}#mapS header h2{flex:1;font-size:18px}
#mapC{flex:1;width:100%;min-height:0;touch-action:none;cursor:crosshair}#mapTp.on{border-color:var(--y);color:var(--y)}
#end{z-index:35}
#end .sheet{width:min(560px,94vw)}#end .rows{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:15px;margin:10px 0}#end .rows b{text-align:right}#end .tot{font:900 34px Inter;color:var(--y);text-align:center;margin:6px 0}
#crash{z-index:34}#crash .sheet{width:min(460px,92vw);text-align:center}#crash .body{display:flex;flex-direction:column;gap:12px;align-items:center}
/* érintés */
#tc{position:fixed;inset:0;z-index:12;pointer-events:none}#tc>*{pointer-events:auto;position:absolute}
#joy{left:max(18px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;border-radius:50%;background:rgba(242,194,48,.35);border:2px solid rgba(242,194,48,.8)}
#thr{right:max(16px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));width:54px;height:170px;border-radius:14px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.18);touch-action:none}
#thrK{position:absolute;left:4px;right:4px;bottom:0;height:24px;margin-bottom:-12px;border-radius:8px;background:rgba(242,194,48,.75)}
#tSpray{right:calc(max(16px,env(safe-area-inset-right)) + 70px);bottom:max(24px,env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;background:rgba(42,167,217,.35);border:2px solid var(--b);font:900 13px Inter}
#tSpray.on{background:rgba(42,167,217,.75)}
.tb{width:46px;height:46px;border-radius:12px;background:rgba(9,14,20,.7);border:1px solid var(--ln);font:900 14px Inter;display:grid;place-items:center}.tb.on{background:rgba(242,194,48,.35)}
#tYawL{right:calc(max(16px,env(safe-area-inset-right)) + 162px);bottom:max(30px,env(safe-area-inset-bottom))}#tYawR{right:calc(max(16px,env(safe-area-inset-right)) + 70px);bottom:calc(max(24px,env(safe-area-inset-bottom)) + 96px)}
#tTop{right:max(12px,env(safe-area-inset-right));top:calc(max(12px,env(safe-area-inset-top)) + 360px);display:flex;flex-direction:column;gap:6px;position:absolute}
@media (max-width:760px){#att{width:104px;height:104px}#mini{width:118px;height:118px}#tele{min-width:0;grid-template-columns:auto auto;padding:6px 9px}#tele .v{font-size:17px}#bars{min-width:0;padding:6px 9px}.hb{grid-template-columns:44px 70px 30px}#mis{left:max(12px,env(safe-area-inset-left));transform:none;top:auto;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 168px);min-width:0;max-width:62vw;padding:5px 10px;text-align:left}#mis .t{font-size:16px}#tTop{top:calc(max(12px,env(safe-area-inset-top)) + 250px)}#hInfo{top:auto;bottom:150px;padding:10px}#hInfo p{display:none}#warn{font-size:18px}}
@media (max-height:500px){#tele>:nth-child(n+5){display:none}#mis{left:max(12px,env(safe-area-inset-left));transform:none;top:calc(max(10px,env(safe-area-inset-top)) + 160px);bottom:auto;max-width:300px;min-width:0;text-align:left;padding:4px 9px}#mis .t{font-size:14px}#mis .s{font-size:10.5px}#mis .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tTop{top:max(10px,env(safe-area-inset-top));right:calc(max(12px,env(safe-area-inset-right)) + 128px);flex-direction:row}#mini{width:96px;height:96px}#att{width:88px;height:88px}#hR{gap:6px}#joy{width:120px;height:120px}#thr{height:130px}}
/* teljes képernyő gomb, DEV jelzés */
.fsB{border:1px solid var(--ln);background:rgba(9,14,20,.7);color:var(--ink);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font:900 16px Inter;cursor:pointer;pointer-events:auto}
@media (pointer:coarse){#hudFs{display:none!important}}
#cd{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font:900 min(22vw,150px)/1 Inter,sans-serif;color:#fff;text-shadow:0 0 30px rgba(255,140,40,.8),0 4px 14px #000;letter-spacing:-.02em}#cd.pop{animation:cdp .9s ease-out}@keyframes cdp{0%{transform:translate(-50%,-50%) scale(1.5);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
#hudFs{position:absolute;right:calc(max(12px,env(safe-area-inset-right)) + 48px);bottom:max(12px,env(safe-area-inset-bottom))}
.devB{display:inline-block;font:900 11px Inter;letter-spacing:.18em;padding:4px 9px;border-radius:7px;background:#e0322a;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
#hudDev{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3}
#fps{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:60;font:700 11px ui-monospace,monospace;color:#9fdcff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px;pointer-events:none;white-space:pre}
</style></head><body>
<canvas id="c"></canvas>
<div id="load"><div class="in"><div class="logo"><b>💧</b>HGWS</div><h2 style="margin-top:14px;font-size:26px">Légi Öntözés</h2><div class="bar"><i id="loadB"></i></div><div class="mut" id="loadT">Betöltés…</div></div></div>

<div id="hud" hidden>
  <div id="hL"><div id="tele" class="pn"></div><div id="bars" class="pn"></div><div id="flags"></div></div>
  <div id="hR"><canvas id="att" width="300" height="300"></canvas><canvas id="mini" width="340" height="340"></canvas></div>
  <div id="mis" class="pn" hidden><div class="t" id="misT"></div><div class="s" id="misS"></div></div>
  <div id="warn" hidden></div><div id="msg"></div><div id="arrow" hidden><i></i><b></b></div><div id="aim" hidden></div><div id="cross" hidden></div>
  <div id="cock" hidden></div>
  <div id="cd" hidden></div><button class="fsB" id="hudFs" hidden>⛶</button><span class="devB" id="hudDev" hidden>DEV</span>
</div>
<div id="tc" hidden>
  <div id="joy"><div id="knob"></div></div><div id="thr"><div id="thrK"></div></div>
  <button id="tSpray">VÍZ</button><button id="tYawL" class="tb">◀</button><button id="tYawR" class="tb">▶</button>
  <div id="tTop"><button class="tb" data-ev="pause">II</button><button class="tb" data-ev="cam">📷</button><button class="tb" data-ev="map">🗺</button><button class="tb" data-ev="gear">G</button><button class="tb" data-ev="flaps">F</button><button class="tb fsB" hidden>⛶</button></div>
</div>

<div id="menu" class="scr" hidden><div class="col">
  <div class="logo"><b>💧</b>HGWS <span class="devB" hidden>DEV</span></div><h1>Légi <span>Öntözés</span></h1><div class="sub">Halász Gergely Watering Solutions – Miskolci főbázis</div>
  <button class="btn y" data-go="szabad"><i>✈</i>Szabad repülés</button>
  <button class="btn" data-go="kuldetes"><i>🎯</i>Küldetések</button>
  <button class="btn" data-go="hangar"><i>🛩</i>Hangár</button>
  <button class="btn" data-go="rang"><i>🏆</i>Ranglista</button>
  <button class="btn" data-go="beall"><i>⚙</i>Beállítások</button>
  <button class="btn" data-go="sugo"><i>🎮</i>Irányítás</button>
  <button class="btn fsM" hidden><i>⛶</i>Teljes képernyő</button>
  <button class="btn" data-go="vissza"><i>←</i>Vissza az Arcade-ba</button>
  <div class="who" id="who"></div>
</div></div>

<div id="hangar" class="scr" hidden>
  <div class="top"><button class="btn sm" data-back>← Vissza</button><h2>Hangár</h2><span class="tag y" id="pts"></span></div>
  <div id="hInfo" class="pn"></div>
  <div id="hList"></div>
</div>

<div id="sheet" class="scr" hidden><div class="sheet pn"><header><button class="btn sm" data-back>← Vissza</button><h2 id="shT"></h2><span id="shX"></span></header><div class="body" id="shB"></div></div></div>

<div id="mapS" hidden><header><h2>Magyarország</h2><span class="mut" id="mapH"></span><button class="btn sm" id="mapTp" hidden>Teleport</button><button class="btn sm" id="mapClr" hidden>Útvonal törlése</button><button class="btn sm" id="mapX">Bezárás (M)</button></header><canvas id="mapC"></canvas></div>
<div id="end" class="scr" hidden><div class="sheet pn"><header><h2 id="endT">Küldetés vége</h2></header><div class="body" id="endB"></div></div></div>
<div id="crash" class="scr" hidden><div class="sheet pn"><div class="body"><div style="font-size:40px">💥</div><h2>Összetörted a gépet</h2><div class="mut" id="crashW"></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn y" id="crashR">Újrakezdés a legközelebbi reptéren</button><button class="btn" id="crashM">Menü</button></div></div></div></div>
<div id="fps" hidden></div>
<script type="module" src="js/main.js?v=202611221737"></script>
</body></html>
