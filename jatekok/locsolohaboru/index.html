<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="robots" content="noindex,nofollow"><title>Locsolóháború – HGWS Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b12;--pn:#0e1522;--pn2:#162033;--ln:rgba(140,180,230,.18);--ink:#e9eef6;--mut:#8b9ab0;--gold:#e8b656;--ok:#5ee08a;--bad:#ff5a4d}
*{box-sizing:border-box;margin:0}html,body{height:100%;background:#000;color:var(--ink);font:500 14px/1.45 Inter,system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#h{pointer-events:none}
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(ellipse at 50% 15%,rgba(30,80,120,.6),rgba(4,8,14,.94));overflow:auto;touch-action:pan-y;z-index:4}
.scr[hidden],[hidden]{display:none!important}
.card{width:min(880px,100%);background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:100%;overflow:auto}
h1{font:900 30px/1.05 Cinzel,Georgia,serif;letter-spacing:.06em;color:var(--gold)}h1 small{display:block;font:700 10px Inter,sans-serif;letter-spacing:.24em;color:var(--mut);margin-top:6px}
h2{font:800 11px Inter,sans-serif;letter-spacing:.2em;color:var(--mut);margin:18px 0 8px;text-transform:uppercase}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.b{border:1px solid var(--ln);background:var(--pn2);color:var(--ink);border-radius:11px;padding:9px 15px;font:700 13px Inter,sans-serif;cursor:pointer}
.b:hover{border-color:rgba(232,182,86,.6)}.b.go{background:linear-gradient(180deg,#f2c76d,#d59d3a);color:#1b1304;border-color:transparent}.b.sm{padding:5px 10px;font-size:12px}.b[disabled]{opacity:.4;cursor:default}.b.on{border-color:var(--gold);color:#ffe29a}
select,input[type=range]{accent-color:var(--gold)}select{background:var(--pn2);color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;font:600 13px Inter,sans-serif}
label{display:flex;flex-direction:column;gap:4px;font:700 10px Inter,sans-serif;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.p{display:flex;align-items:center;gap:9px;background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:8px 10px}.p i{width:14px;height:14px;border-radius:50%;flex:none}.p b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.p small{color:var(--mut);font-weight:700}.p.rdy small{color:var(--ok)}
.sw{display:flex;gap:6px}.sw button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw button.on{border-color:#fff}
#st{min-height:20px;color:var(--mut);font-weight:600;margin-top:10px}#st.warn{color:var(--gold)}#st.err{color:var(--bad)}
.rm{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--ln);border-radius:12px;background:var(--pn2);margin-bottom:6px}
table{width:100%;border-collapse:collapse;margin-top:8px}th{font:800 10px Inter;letter-spacing:.14em;color:var(--mut);text-align:right;padding:6px 8px}th:first-child,td:first-child{text-align:left}td{padding:7px 8px;border-top:1px solid var(--ln);text-align:right;font-weight:600}tr.me td{color:#ffe29a}tr.win td:first-child::after{content:" 🏆"}
input.lnk{width:100%;background:var(--pn2);border:1px solid var(--ln);border-radius:10px;color:var(--ink);padding:8px 10px;font:600 12px Inter;-webkit-user-select:text;user-select:text}
.set{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.set label span{color:var(--ink);letter-spacing:0;font-size:12px;text-transform:none}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}.keys .k{display:flex;justify-content:space-between;align-items:center;background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:6px 10px;font-weight:600}.keys .k button{min-width:86px}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:rgba(14,21,34,.95);border:1px solid var(--ln);border-radius:12px;padding:9px 16px;font-weight:700;z-index:9;opacity:0;transition:opacity .25s;pointer-events:none}#toast.on{opacity:1}
#tc{position:fixed;inset:0;z-index:2}#tc .tb{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(14,21,34,.55);border:2px solid rgba(255,255,255,.25);color:#fff;font:800 13px Inter;display:flex;align-items:center;justify-content:center;touch-action:none}
#tc .tb.fire{width:92px;height:92px;right:22px;bottom:30px;background:rgba(80,160,230,.5)}#tc .tb.on{background:rgba(232,182,86,.6)}
@media(max-width:600px){h1{font-size:22px}.card{padding:14px}}
</style></head><body>
<canvas id="c"></canvas><canvas id="h"></canvas>
<div id="tc" hidden>
  <div class="tb fire" data-b="fire">LŐ</div>
  <div class="tb" data-b="jump" style="right:128px;bottom:40px">UGRÁS</div>
  <div class="tb" data-b="crouch" style="right:128px;bottom:112px">GUGG.</div>
  <div class="tb" data-b="reload" style="right:40px;bottom:136px">TÖLT</div>
  <div class="tb" data-b="wnext" style="right:200px;bottom:40px">FEGYV.</div>
  <div class="tb" data-b="aim" style="right:40px;bottom:208px">CÉLOZ</div>
  <div class="tb" data-b="menu" style="left:50%;top:10px;width:48px;height:48px;margin-left:-24px">II</div>
</div>
<div class="scr" id="menu"><div class="card">
  <h1>LOCSOLÓHÁBORÚ<small>ELSŐ SZEMÉLYŰ VÍZIPISZTOLY-ARÉNA · 2–8 JÁTÉKOS</small></h1>
  <h2>Játék</h2>
  <div class="row"><label>Mód<select id="mMode"></select></label><label>Pálya<select id="mMap"></select></label><label>Létszám (botokkal)<select id="mFill"></select></label></div>
  <div class="row" style="margin-top:14px"><button class="b go" id="mSolo">Gyakorlás botokkal</button><button class="b" id="mCreate">Szoba létrehozása</button><label class="row" style="flex-direction:row;letter-spacing:.06em"><input type="checkbox" id="mOpen" checked> barátaim szabadon beléphetnek</label><span class="grow"></span><button class="b sm" id="mSet">Beállítások</button></div>
  <h2 id="rmH">Barátok szobái</h2><div id="rooms"></div>
  <div id="st"></div>
</div></div>
<div class="scr" id="lobby" hidden><div class="card">
  <div class="row"><h1 class="grow">VÁRÓTEREM<small id="lSub"></small></h1><button class="b sm" id="lSet">Beállítások</button><button class="b sm" id="lLeave">Kilépés</button></div>
  <h2>Játékosok</h2><div class="pl" id="lPl"></div>
  <h2>Színed</h2><div class="sw" id="lSw"></div>
  <div id="lHost"><h2>Beállítások</h2><div class="row"><label>Mód<select id="lMode"></select></label><label>Pálya<select id="lMap"></select></label><label>Létszám (botokkal)<select id="lFill"></select></label></div>
    <h2>Meghívás</h2><div id="lFr" class="row"></div><div class="row" style="margin-top:8px"><input class="lnk grow" id="lLink" readonly><button class="b sm" id="lCopy">Link másolása</button></div></div>
  <div id="lInfo" style="margin-top:12px;color:var(--mut);font-weight:600"></div>
  <div class="row" style="margin-top:16px"><button class="b" id="lReady">Kész</button><button class="b go" id="lStart">Indítás</button><span id="lSt" class="grow" style="color:var(--mut);font-weight:600"></span></div>
</div></div>
<div class="scr" id="pause" hidden><div class="card" style="width:min(420px,100%)">
  <h1>SZÜNET<small id="pSub">A MECCS MEGY TOVÁBB</small></h1>
  <div class="row" style="margin-top:16px;flex-direction:column;align-items:stretch"><button class="b go" id="pResume">Folytatás</button><button class="b" id="pSet">Beállítások</button><button class="b" id="pLeave">Kilépés a meccsből</button></div>
</div></div>
<div class="scr" id="sets" hidden><div class="card">
  <div class="row"><h1 class="grow">BEÁLLÍTÁSOK</h1><button class="b go" id="sOk">Kész</button></div>
  <div class="set" style="margin-top:14px">
    <label>Egérérzékenység <span id="vSens"></span><input type="range" id="sSens" min="0.2" max="3" step="0.05"></label>
    <label>Látószög (FOV) <span id="vFov"></span><input type="range" id="sFov" min="60" max="110" step="1"></label>
    <label>Hangerő <span id="vVol"></span><input type="range" id="sVol" min="0" max="1" step="0.05"></label>
    <label>Grafika<select id="sQ"><option value="0">Alacsony</option><option value="1">Közepes</option><option value="2">Magas</option></select></label>
  </div>
  <h2>Billentyűk</h2><div class="keys" id="sKeys"></div>
  <div class="row" style="margin-top:10px"><button class="b sm" id="sReset">Alapértékek</button></div>
</div></div>
<div class="scr" id="res" hidden><div class="card">
  <h1 id="rT"></h1><div id="rS" style="margin-top:6px;color:var(--mut);font-weight:600"></div>
  <table id="rTab"></table>
  <div class="row" style="margin-top:16px"><button class="b go" id="rAgain">Visszavágó</button><button class="b" id="rLeave">Kilépés</button><span id="rSt" class="grow" style="color:var(--mut);font-weight:600"></span></div>
</div></div>
<div id="toast"></div>
<script type="module" src="./kliens.js?v=202611212058"></script>
</body></html>
