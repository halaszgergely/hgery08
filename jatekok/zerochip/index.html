<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="robots" content="noindex,nofollow"><title>Zero Chip – a tranzisztortól a processzorig</title>
<style>
:root{--bg:#070b12;--pn:#0e1522;--pn2:#141d2e;--ln:rgba(140,180,230,.16);--ink:#e9eef6;--mut:#8b9ab0;--gold:#e8b656;--ok:#5ee08a;--bad:#ff5a4d}
*{box-sizing:border-box;margin:0}html,body{height:100%;background:var(--bg);color:var(--ink);font:500 14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:grid;grid-template-columns:230px 1fr 250px;height:100%}
aside{background:var(--pn);overflow:auto;padding:14px}#side{border-right:1px solid var(--ln)}#info{border-left:1px solid var(--ln)}
h1{font:800 20px/1.1 Georgia,serif;letter-spacing:.08em;color:var(--gold)}h1 small{display:block;font:600 10px system-ui;letter-spacing:.2em;color:var(--mut);margin-top:5px}
.ch{margin:16px 0 6px;font:800 10px system-ui;letter-spacing:.18em;color:var(--mut)}
.lv{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border:0;border-radius:9px;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.lv:hover{background:var(--pn2)}.lv.on{background:rgba(232,182,86,.14);color:#ffe29a}.lv[disabled]{opacity:.35;cursor:default}.lv i{font-style:normal;width:18px;text-align:center;color:var(--mut)}.lv.done i{color:var(--ok)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#head{padding:12px 16px;border-bottom:1px solid var(--ln);background:var(--pn)}#head b{font:700 17px Georgia,serif;color:#ffe29a}#head p{color:#c5cfdd;margin-top:3px;max-width:900px}
#wrap{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}canvas{display:block;touch-action:none;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:9px 16px;border-radius:999px;background:rgba(10,16,28,.94);border:1px solid var(--ln);font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}#toast.on{opacity:1}#toast.ok{color:var(--ok);border-color:rgba(94,224,138,.5)}#toast.bad{color:var(--bad);border-color:rgba(255,90,77,.5)}
#bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:10px 12px;border-top:1px solid var(--ln);background:var(--pn)}
.b{padding:8px 12px;border-radius:9px;border:1px solid var(--ln);background:var(--pn2);color:var(--ink);font:700 12.5px system-ui;cursor:pointer;white-space:nowrap}.b:hover{border-color:rgba(232,182,86,.5)}.b.on{background:rgba(232,182,86,.18);border-color:var(--gold);color:#ffe29a}
.b.go{margin-left:auto;background:linear-gradient(180deg,#ffe29a,#d89a36);color:#2a1a06;border-color:transparent}.b.nx{background:linear-gradient(180deg,#8df0ad,#38b866);color:#06250f;border-color:transparent}.sep{width:1px;height:24px;background:var(--ln);margin:0 3px}
#info h3{font:800 10px system-ui;letter-spacing:.18em;color:var(--mut);margin-bottom:8px}table{border-collapse:collapse;width:100%;font:600 12.5px ui-monospace,Menlo,monospace}th,td{padding:3px 5px;text-align:center;border-bottom:1px solid var(--ln)}th{color:var(--gold)}td.o{color:#9fd8ff}tr.ok td:last-child{color:var(--ok)}tr.bad{background:rgba(255,90,77,.12)}tr.bad td:last-child{color:var(--bad)}th.s,td.s{border-left:1px solid var(--ln)}
#res{margin-top:12px;color:#c5cfdd}#res b{color:#ffe29a}
#doc{position:fixed;inset:0;z-index:20;background:rgba(3,6,12,.82);display:none;place-items:center;padding:14px}#doc.on{display:grid}
#doc>div{display:grid;grid-template-columns:200px 1fr;width:min(1040px,100%);height:min(820px,100%);background:var(--pn);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
#dnav{padding:14px;border-right:1px solid var(--ln);overflow:auto}#dnav b{display:block;font:800 16px Georgia,serif;color:var(--gold);margin-bottom:10px}#dnav a{display:block;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer}#dnav a:hover{background:var(--pn2)}
#dbody{overflow:auto;padding:6px 26px 30px;position:relative;scroll-behavior:smooth}#dbody h2{font:700 21px Georgia,serif;color:#ffe29a;margin:26px 0 8px;padding-top:6px}#dbody p,#dbody li{color:#d3dbe7;font-size:15px;line-height:1.6;margin:7px 0}#dbody ul{padding-left:20px}#dbody b{color:#fff}
.fig{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;margin:14px 0;padding:16px;border-radius:12px;background:#141d2e;border:1px solid var(--ln)}.fig svg{width:100%;height:auto}.cap{font-size:13px!important;color:var(--mut)!important;text-align:center}
.tt{width:auto;margin:8px 0;font-size:13px}.tt td,.tt th{padding:3px 10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin:10px 0}.grid b{color:var(--gold)!important}
#dx{position:sticky;top:8px;float:right;z-index:2}
@media (max-width:980px){#doc>div{grid-template-columns:1fr}#dnav{display:none}#dbody{padding:4px 16px 24px}#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}#side{display:flex;gap:6px;align-items:center;padding:8px 10px;border-right:0;border-bottom:1px solid var(--ln);overflow-x:auto}#side h1{font-size:15px;white-space:nowrap}#side h1 small,.ch{display:none}.lv{width:auto;white-space:nowrap;padding:6px 9px}#info{display:none}#head{padding:8px 12px}#head p{font-size:12.5px}}
</style></head>
<body><div id="app"><aside id="side"></aside><main><div id="head"></div><div id="wrap"><canvas id="c"></canvas><div id="toast"></div></div><div id="bar"></div></main><aside id="info"></aside></div>
<div id="doc"><div><nav id="dnav"></nav><div id="dbody"></div></div></div>
<script src="kezikonyv.js?v=202611210129"></script><script src="chip.js?v=202611210129"></script></body></html>
