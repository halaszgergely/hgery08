<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="robots" content="noindex,nofollow"><title>Zero Quest – pályaszerkesztő</title>
<style>html,body{margin:0;height:100%;background:#07070a;overflow:hidden;overscroll-behavior:none}canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}#c{cursor:crosshair;z-index:2}#g{z-index:1}#no{position:fixed;inset:0;display:none;place-items:center;text-align:center;color:#e8b656;font:600 15px system-ui,sans-serif;letter-spacing:.12em;padding:2rem}</style></head>
<body><canvas id="g"></canvas><canvas id="c"></canvas><div id="no">ZERO QUEST · PÁLYASZERKESZTŐ<br><br>Csak adminoknak, az admin felületről.</div>
<script>/* pályaszerkesztő: csak az admin felületről, admin ranggal nyílik meg */
(function(){var ok=false;try{ok=top!==self&&parent.location.origin===location.origin&&parent.HGZQ_EDIT===true}catch(_){}
window.ZQ_EDITOR=true;var work=null;try{work=JSON.parse(localStorage.getItem('zqed_work')||'null')}catch(_){}
if(!ok){document.getElementById('c').remove();document.getElementById('g').remove();document.getElementById('no').style.display='grid';return}
fetch('palya.json'+(location.search||'?v=1')).then(function(r){return r.ok?r.json():null}).catch(function(){return null}).then(function(j){window.ZQMAP=work||j;return ['vilag.js','epit.js','jatek.js','targy.js','palya.js','szerk.js','rajz.js','harom.js'].reduce(function(p,f){return p.then(function(){return new Promise(function(r){var s=document.createElement('script');if(f==='harom.js')s.type='module';s.src=f+(location.search||'?v=1');s.onload=r;s.onerror=r;document.body.appendChild(s)})})},Promise.resolve())})})();</script></body></html>
