<style>
  :root{
    --paprika:#C1351D; --paprika-dark:#8B1A0E; --paprika-glow:rgba(193,53,29,.12);
    --cream:#FDF6EC; --warm-white:#FFFCF5; --wheat:#E8D5B7;
    --dark:#2A1810; --dark-soft:#4A3528; --gold:#D4A843; --gold-light:rgba(212,168,67,.14);
    --border:#E0D0BB;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}
  body{
    font-family:'Source Serif 4',Georgia,serif; color:var(--dark);
    background:
      radial-gradient(ellipse at 15% 12%, var(--paprika-glow) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 88%, var(--gold-light) 0%, transparent 45%),
      var(--cream);
    min-height:100dvh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.10;
    background-image:
      repeating-linear-gradient(0deg,transparent,transparent 49px,var(--border) 49px,var(--border) 50px),
      repeating-linear-gradient(90deg,transparent,transparent 49px,var(--border) 49px,var(--border) 50px);
  }
  .topbar,main,footer{position:relative;z-index:1}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;row-gap:.5rem;
    padding:.7rem 1.2rem;border-bottom:1px solid var(--border);
    background:rgba(253,246,236,.9);backdrop-filter:blur(10px);position:sticky;top:0;
  }
  .brand{font-family:'Playfair Display',serif;font-weight:700;font-size:1.05rem;color:var(--dark)}
  .brand em{color:var(--paprika);font-style:italic}
  .topbar-right{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
  .navlink{
    font-family:'Crimson Pro',serif;font-size:.82rem;font-weight:600;letter-spacing:.05em;
    color:var(--dark-soft);text-decoration:none;border:1px solid var(--border);
    border-radius:100px;padding:.35rem .9rem;background:var(--warm-white);
    transition:all .2s;white-space:nowrap;
  }
  .navlink:hover{border-color:var(--paprika);color:var(--paprika)}

  .langsel{display:inline-flex;border:1px solid var(--border);border-radius:100px;overflow:hidden;background:var(--warm-white)}
  .langbtn{
    font-family:'Crimson Pro',serif;font-size:.78rem;font-weight:600;letter-spacing:.04em;
    color:var(--dark-soft);background:transparent;border:none;border-right:1px solid var(--border);
    padding:.35rem .7rem;cursor:pointer;transition:all .18s;
  }
  .langbtn:last-child{border-right:none}
  .langbtn:hover{color:var(--paprika)}
  .langbtn[aria-pressed="true"]{background:var(--paprika);color:#fff}

  main{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:1.4rem;
    padding:1.8rem 1.4rem 2.4rem;text-align:center;max-width:640px;margin:0 auto;width:100%;
  }
  .badge{
    display:inline-flex;align-items:center;gap:.4rem;background:var(--paprika);color:#fff;
    font-family:'Crimson Pro',serif;font-size:.72rem;font-weight:600;letter-spacing:.22em;
    text-transform:uppercase;padding:.4rem 1.1rem;border-radius:100px;
  }

  .datenav{display:flex;align-items:center;gap:.4rem}
  .arrow{
    width:38px;height:38px;flex:0 0 auto;border:1px solid var(--border);
    background:var(--warm-white);color:var(--dark);border-radius:50%;
    font-size:1.1rem;line-height:1;cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:all .18s;
  }
  .arrow:hover{border-color:var(--paprika);color:var(--paprika)}
  .date-label{position:relative}
  .date-label .txt{
    font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--dark);
    padding:2px 12px;min-width:150px;cursor:pointer;border-bottom:1px solid transparent;
    transition:border-color .18s;display:inline-block;
  }
  .date-label .txt:hover{border-bottom-color:var(--paprika)}
  .date-label input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
  .today-link{background:none;border:none;color:var(--dark-soft);font-family:'Crimson Pro',serif;font-size:.8rem;cursor:pointer;text-decoration:underline}
  .today-link:hover{color:var(--paprika)}
  .today-link[hidden]{display:none}

  #stage{width:100%;display:flex;flex-direction:column;justify-content:center;min-height:38dvh}
  .fact{animation:rise .5s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fact{animation:none}}
  .lead{font-family:'Crimson Pro',serif;font-style:italic;font-size:clamp(1rem,4vw,1.3rem);color:var(--paprika);margin-bottom:.7rem}
  .body{
    font-family:'Playfair Display',serif;font-weight:700;
    font-size:clamp(1.7rem,6.6vw,2.7rem);line-height:1.16;color:var(--dark);
    letter-spacing:-.01em;text-wrap:balance;
  }
  .cheers{font-family:'Crimson Pro',serif;font-style:italic;font-size:clamp(1rem,3.7vw,1.25rem);color:var(--dark-soft);margin-top:1rem;text-wrap:balance}
  .chip{
    display:inline-block;margin-top:1.2rem;font-family:'Crimson Pro',serif;font-size:.7rem;
    font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    background:var(--gold-light);color:#a9822f;border-radius:100px;padding:.28rem .9rem;
  }
  .fact a.src{display:block;margin-top:1rem;color:var(--dark-soft);font-family:'Crimson Pro',serif;font-size:.8rem;text-decoration:underline}
  .fact a.src:hover{color:var(--paprika)}
  .state{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--dark-soft)}
  .state small{display:block;font-family:'Crimson Pro',serif;font-size:.85rem;margin-top:.6rem}
  .netnote{margin-top:1.2rem;font-family:'Crimson Pro',serif;font-size:.82rem;color:var(--dark-soft)}
  .linkbtn{background:none;border:none;padding:0;color:var(--paprika);font-size:.82rem;cursor:pointer;text-decoration:underline;font-family:inherit}

  .cta{
    font-family:'Crimson Pro',serif;font-weight:600;font-size:1.05rem;letter-spacing:.02em;
    background:var(--paprika);color:#fff;border:none;border-radius:100px;padding:.85rem 2.2rem;
    cursor:pointer;transition:background .18s,transform .1s;box-shadow:0 6px 22px rgba(193,53,29,.22);
  }
  .cta:hover{background:var(--paprika-dark)}
  .cta:active{transform:translateY(1px)}
  .cta:disabled{opacity:.5;cursor:default}

  footer{text-align:center;padding:2.2rem 1.4rem;background:var(--dark);color:var(--wheat);font-family:'Crimson Pro',serif}
  .footer-brand{font-family:'Playfair Display',serif;font-weight:700;font-size:1.2rem;margin-bottom:.4rem}
  footer p{font-size:.82rem;opacity:.75;max-width:520px;margin:0 auto;line-height:1.55}
  footer a{color:var(--wheat)}
  footer a:hover{color:#fff}

  :focus-visible{outline:2px solid var(--paprika);outline-offset:2px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:100px;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;z-index:2}
  .toast.show{opacity:1}
  .toast[hidden]{display:none}
</style>

/* ============================================================
   Állapot
   ============================================================ */
let LANG = "hu";
let T = I18N.hu;
let selected = new Date();
let cache = {};          // "LANG-M-D" -> {esemeny:[],szuletes:[],halalozas:[]}
let current = null;      // az aktuális naphoz feldolgozott adat
let filter = "vicces";
let lastKey = null;      // hogy reroll-nál ne ismétlődjön ugyanaz
let netFailed = false;   // igaz, ha a nap nem tölthető (offline / blokkolt)

const $ = id => document.getElementById(id);
const stage = $("stage");

/* ---------- dátum-segédek ---------- */
function wikiPageTitle(d){ return T.wiki.pageTitle(d); }
function dateLabel(d){ return T.dateLabel(d); }
function ymd(d){
  const m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${d.getFullYear()}-${m}-${day}`;
}
function isToday(d){
  const t=new Date();
  return d.getDate()===t.getDate() && d.getMonth()===t.getMonth();
}
function refYear(d){
  const now=new Date();
  const anchor=new Date(now.getFullYear(), d.getMonth(), d.getDate());
  return anchor>now ? now.getFullYear()-1 : now.getFullYear();
}

/* ---------- gyöngyszemek az aktuális nyelven ---------- */
function gemItems(){
  const key=`${String(selected.getMonth()+1).padStart(2,"0")}-${String(selected.getDate()).padStart(2,"0")}`;
  return (GEMS[key]||[]).map(g=>{
    const t=g[LANG]||g.hu;
    return {gem:true, year:g.year, text:t.text, drink:t.drink};
  });
}

/* ---------- koccintós indok generálás ---------- */
function drinkReason(kind, ya){
  const d=T.drink;
  const base=(d[kind]||[]).concat(d.general);
  const t=base[Math.floor(Math.random()*base.length)];
  const many = LANG==="hu" ? "sok" : (LANG==="pl" ? "wiele" : "many");
  return t.replace(/\{N\}/g, (ya!=null && ya>0) ? ya : many);
}

/* ---------- fura-detektor: a vicces/meglepő felé húz ---------- */
function scoreEvent(t){
  const s=" "+t.toLowerCase()+" ";
  let sc=0;
  for(const w of T.pos) if(s.includes(w)) sc+=2;
  for(const w of T.neg) if(s.includes(w)) sc-=3;
  return sc;
}
function weirdEvents(){
  if(!current) return [];
  return current.esemeny
    .map(e=>({e,s:scoreEvent(e.text)}))
    .filter(x=>x.s>=1)
    .sort((a,b)=>b.s-a.s)
    .slice(0,8)
    .map(x=>x.e);
}

/* ---------- wikitext feldolgozás ---------- */
function cleanWikitext(s){
  s = s.replace(/<ref[^>]*>[\s\S]*?<\/ref>/gi,"")
       .replace(/<ref[^>]*\/>/gi,"")
       .replace(/<!--[\s\S]*?-->/g,"")
       .replace(/\{\{[^{}]*\}\}/g,"").replace(/\{\{[^{}]*\}\}/g,"")
       .replace(/\[\[(?:[^\]|]*\|)?([^\]]+)\]\]/g,"$1")
       .replace(/\[https?:\/\/[^\s\]]+\s+([^\]]+)\]/g,"$1")
       .replace(/'''?/g,"")
       .replace(/&nbsp;/g," ")
       .replace(/<[^>]+>/g,"")
       .replace(/\s+/g," ")
       .trim();
  return s;
}

function parseItem(content, kind){
  const c = cleanWikitext(content);
  if(!c) return null;
  let m = c.match(/^(i\.\s*e\.\s*)?(\d{1,4})\.?\s*[–—-]\s*(.+)$/);
  let bc, year, text;
  if(m){ bc=!!m[1]; year=parseInt(m[2],10); text=m[3].trim(); }
  else{
    const y = c.match(/^(i\.\s*e\.\s*)?(\d{1,4})\b(.*)$/);
    if(!y) return null;
    bc=!!y[1]; year=parseInt(y[2],10);
    text=y[3].replace(/^[\s.:–—-]+/,"").trim();
  }
  if(!text || text.length<3) return null;
  return {bc,year,text,kind};
}

function parseWikitext(wt){
  const buckets={esemeny:[],szuletes:[],halalozas:[]};
  let cur=null;
  for(const raw of wt.split("\n")){
    const line=raw.trim();
    const h=line.match(/^==\s*([^=].*?)\s*==$/);
    if(h){ cur=T.wiki.sectionOf(h[1].trim()); continue; }
    if(!cur) continue;
    if(line[0]!=="*" || line[1]==="*") continue;   // csak egyszintű felsorolás
    const item=parseItem(line.replace(/^\*+\s*/,""), cur);
    if(item) buckets[cur].push(item);
  }
  return buckets;
}

/* ---------- lekérés ---------- */
async function loadDay(d){
  const key=`${LANG}-${d.getMonth()}-${d.getDate()}`;
  if(cache[key]) return cache[key];
  const title=wikiPageTitle(d);
  const api=`https://${T.wiki.domain}/w/api.php?action=parse&page=${encodeURIComponent(title)}`
          + `&prop=wikitext&format=json&formatversion=2&origin=*`;
  const attempts=[
    api,
    "https://api.allorigins.win/raw?url="+encodeURIComponent(api),
    "https://corsproxy.io/?url="+encodeURIComponent(api)
  ];
  let lastErr;
  for(const u of attempts){
    try{
      const res=await fetch(u);
      if(!res.ok) throw new Error("http "+res.status);
      const j=await res.json();
      const wt=j && j.parse && j.parse.wikitext;
      if(!wt) throw new Error("empty");
      const data=parseWikitext(wt);
      cache[key]=data;
      return data;
    }catch(e){ lastErr=e; }
  }
  throw lastErr || new Error("fail");
}

/* ---------- pool + választás ---------- */
function funnyItems(){ return T.funny.map(text=>({funny:true,text})); }
function poolFor(f){
  if(f==="urugy") return funnyItems();
  if(f==="minden"){
    if(!current) return netFailed ? funnyItems() : [];
    return [...current.esemeny, ...current.szuletes, ...current.halalozas];
  }
  const gems=gemItems();
  const weird=weirdEvents();
  let p = gems.length ? gems.concat(gems, gems, weird) : weird.slice();
  if(!p.length && current && current.esemeny.length) p = current.esemeny.slice();
  if(!p.length) p = funnyItems();
  return p;
}
function pickRandom(){
  const pool=poolFor(filter);
  if(!pool.length) return null;
  if(pool.length===1) return pool[0];
  let item, key, guard=0;
  do{
    item=pool[Math.floor(Math.random()*pool.length)];
    key=(item.gem?"g":item.funny?"f":"w")+(item.year||"")+item.text;
    guard++;
  }while(key===lastKey && guard<16);
  lastKey=key;
  return item;
}

/* ---------- megjelenítés ---------- */
let currentText="";
function renderFact(item){
  const u=T.ui;
  if(!item){
    stage.innerHTML=`<div class="state">${u.noFactTitle}<small>${u.noFactSmall}</small></div>`;
    currentText="";
    return;
  }

  if(item.funny){
    currentText=`${u.leadFunny} ${item.text}`;
    const note = (netFailed && filter==="minden")
      ? `<div class="netnote">${u.netnote} <button class="linkbtn" id="retry2">${u.retry}</button></div>`
      : "";
    stage.innerHTML=`
      <div class="fact">
        <div class="lead">${u.leadFunny}</div>
        <div class="body">${escapeHtml(item.text)}</div>
        <div><span class="chip">${u.chipFunny}</span></div>
        ${note}
      </div>`;
    const r=$("retry2"); if(r) r.onclick=refresh;
    return;
  }

  if(item.gem){
    const ya=refYear(selected)-item.year;
    const lead = ya>0 ? T.ago(ya,item.year) : `${item.year}`;
    currentText=`${lead}: ${item.text}\n→ ${item.drink}`;
    stage.innerHTML=`
      <div class="fact">
        <div class="lead">${lead}</div>
        <div class="body">${escapeHtml(item.text)}</div>
        <div class="cheers">${escapeHtml(item.drink)}</div>
        <div><span class="chip">${u.chipGem}</span></div>
      </div>`;
    return;
  }

  const k=T.kinds[item.kind];
  let lead, ya=null;
  if(item.bc){
    lead = T.bc(item.year) + (item.kind==="esemeny" ? "" : ` — ${k.verb}`);
  }else{
    ya=refYear(selected)-item.year;
    const stem = ya>0 ? T.ago(ya,item.year) : `${item.year}`;
    lead = item.kind==="esemeny" ? stem : `${stem} — ${k.verb}`;
  }
  const cheers=drinkReason(item.kind, ya);
  currentText=`${lead}: ${item.text}\n→ ${cheers}`;
  stage.innerHTML=`
    <div class="fact">
      <div class="lead">${lead}</div>
      <div class="body">${escapeHtml(item.text)}</div>
      <div class="cheers">${escapeHtml(cheers)}</div>
      <div><span class="chip">${k.label}</span></div>
      <a class="src" href="https://${T.wiki.domain}/wiki/${encodeURIComponent(wikiPageTitle(selected))}" target="_blank" rel="noopener">${u.srcLabel}</a>
    </div>`;
}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

/* ---------- folyamat ---------- */
async function refresh(){
  stage.innerHTML=`<div class="state">${T.ui.loading}</div>`;
  $("dateText").textContent=dateLabel(selected);
  $("datePicker").value=ymd(selected);
  $("todayBtn").hidden=isToday(selected);
  if(filter==="urugy"){ lastKey=null; renderFact(pickRandom()); return; }

  if(filter==="vicces" && gemItems().length){
    current=null; netFailed=false; lastKey=null;
    renderFact(pickRandom());
    $("reroll").disabled=false;
    loadDay(selected).then(d=>{current=d;}).catch(()=>{});
    return;
  }

  $("reroll").disabled=true;
  try{
    current=await loadDay(selected);
    netFailed=false; lastKey=null;
    renderFact(pickRandom());
  }catch(err){
    current=null; netFailed=true; lastKey=null;
    renderFact(pickRandom());
  }finally{
    $("reroll").disabled=false;
  }
}
function shiftDay(n){
  selected=new Date(selected.getFullYear(), selected.getMonth(), selected.getDate()+n);
  refresh();
}

/* ---------- nyelvváltás ---------- */
function detectLang(){
  try{ const s=localStorage.getItem("mmi_lang"); if(s && I18N[s]) return s; }catch(e){}
  const n=(navigator.language||"").slice(0,2).toLowerCase();
  if(n==="en") return "en";
  if(n==="pl") return "pl";
  return "hu";
}
function setLang(code){
  if(!I18N[code]) code="hu";
  LANG=code; T=I18N[code];
  try{ localStorage.setItem("mmi_lang", code); }catch(e){}
  const u=T.ui;
  document.documentElement.lang=u.htmlLang;
  document.title=u.docTitle;
  $("brand").innerHTML=u.brand;
  $("navRecipes").textContent=u.navRecipes;
  $("badge").textContent=u.badge;
  $("prev").setAttribute("aria-label",u.prevAria);
  $("next").setAttribute("aria-label",u.nextAria);
  $("datePicker").setAttribute("aria-label",u.pickAria);
  $("todayBtn").textContent=u.today;
  $("reroll").textContent=u.reroll;
  $("footerBrand").textContent=u.footerBrand;
  $("footerText").innerHTML=u.footerHtml;
  const wl=$("wikiLink"); if(wl) wl.href=`https://${T.wiki.domain}/`;
  $("langsel").setAttribute("aria-label",u.langAria);
  document.querySelectorAll(".langbtn").forEach(b=>{
    b.setAttribute("aria-pressed", b.dataset.lang===code ? "true" : "false");
  });
  lastKey=null;
  refresh();
}

/* ---------- események ---------- */
$("prev").onclick=()=>shiftDay(-1);
$("next").onclick=()=>shiftDay(1);
$("todayBtn").onclick=()=>{selected=new Date();refresh();};
$("datePicker").onchange=e=>{
  const v=e.target.value; if(!v) return;
  const [y,m,d]=v.split("-").map(Number);
  selected=new Date(y,m-1,d); refresh();
};
$("reroll").onclick=()=>{ renderFact(pickRandom()); };
document.querySelectorAll(".langbtn").forEach(b=>{
  b.onclick=()=>setLang(b.dataset.lang);
});

setLang(detectLang());
</script>
</body>
</html>
